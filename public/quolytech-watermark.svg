<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Circle Background for high visibility in dark and light browser tabs -->
  <circle cx="250" cy="250" r="240" fill="#ffffff" />
  
  <!-- Outer Circular Ring with Bottom-Right Cutout Gap -->
  <path 
    d="M 378 308 A 180 180 0 1 0 308 412" 
    stroke="#000000" 
    stroke-width="36" 
    stroke-linecap="round" 
    fill="none" 
  />
  
  <!-- Left Code Bracket < -->
  <path 
    d="M 200 175 L 155 235 L 200 295" 
    stroke="#000000" 
    stroke-width="34" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    fill="none" 
  />
  
  <!-- Center Slash / -->
  <path 
    d="M 265 160 L 235 310" 
    stroke="#000000" 
    stroke-width="34" 
    stroke-linecap="round" 
    fill="none" 
  />
  
  <!-- Right Code Bracket & Q Tail Extension -->
  <path 
    d="M 285 175 L 330 235 L 275 290 L 385 400" 
    stroke="#000000" 
    stroke-width="34" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    fill="none" 
  />
</svg>
